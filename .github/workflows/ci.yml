name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: pip install --no-deps -r requirements.lock -r requirements-dev.lock
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy common generators ingestion processing database batch observability admin scripts
      - name: Unit tests
        run: pytest tests/unit -q
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Helm chart lint and render
        run: |
          helm lint deploy/helm/payment-recon --strict
          helm template ci deploy/helm/payment-recon --set simulators.enabled=true --set serviceMonitor.enabled=true > /dev/null

  integration:
    needs: lint-and-unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: CI environment file (placeholder secrets only)
        run: cp .env.example .env
      # The test container runs as uid 10001 and writes coverage into this bind mount.
      - name: Writable reports directory
        run: install -d -m 0777 reports
      - name: Build images
        run: docker compose --profile test build
      - name: Start schema registry (Avro integration tests)
        run: |
          if ! docker compose --profile avro up -d --wait schema-registry; then
            docker compose --profile avro logs --tail 30 schema-registry kafka | tail -n 30 | while IFS= read -r line; do
              echo "::error title=schema-registry::${line:0:300}"; done
            exit 1
          fi
      - name: Integration, end-to-end and recovery tests with coverage
        env:
          SCHEMA_REGISTRY_URL: http://schema-registry:8081
        run: |
          set -o pipefail
          if ! docker compose --profile test run --rm tests 2>&1 | tee pytest.log; then
            # Annotations are visible without log access: surface the failing tests and their errors.
            grep -E '^(FAILED|ERROR) |^E  ' pytest.log | head -n 10 | while IFS= read -r line; do
              echo "::error title=pytest::${line:0:400}"; done
            exit 1
          fi
      - name: Service logs on failure
        if: failure()
        run: docker compose --profile test --profile avro logs --tail 100 kafka postgres kafka-init db-init schema-registry
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: reports/htmlcov
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: docker compose --profile test --profile avro down -v

  # The image the Helm chart deploys: ghcr.io/<owner>/payment-system:<sha> (and :latest), only after tests pass.
  publish-image:
    needs: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Build and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$image:$GITHUB_SHA" -t "$image:latest" .
          docker push "$image:$GITHUB_SHA"
          docker push "$image:latest"
          echo "Image: $image:$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Deploy to VM over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if ! timeout 15 bash -c "</dev/tcp/$SSH_HOST/22" 2>/dev/null; then
            echo "::notice::Production VM is stopped; this commit will be deployed by 'infra/vm.ps1 start'."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "cd ~/payment-system && bash deploy/deploy.sh $GITHUB_SHA"
