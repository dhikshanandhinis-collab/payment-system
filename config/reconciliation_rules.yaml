# Reconciliation rules (versioned).
#
# Any change to matching behaviour or waiting periods MUST bump rule_version. The service refuses to
# start if the same rule_version is already registered in the database with a different content hash.
#
# Waiting periods are SYNTHETIC engineering defaults chosen so that the local demo surfaces exceptions
# within minutes. They are NOT Bell service-level agreements; production values must come from the
# business owners of each payment channel.
rule_version: "2026.11.2"
description: "Adds chargebacks, settlement-file reconciliation with fees, and a bank business-day calendar."

grace_periods_seconds:
  application_record: 300          # processor/ledger record seen, waiting for the app record
  processor_outcome:               # app payment initiated, waiting for capture/decline
    default: 300
    CREDIT_CARD: 180
    DEBIT_CARD: 180
    ONLINE_BANKING: 600
    PRE_AUTHORIZED_DEBIT: 900
  billing_posting:                 # capture seen, waiting for an effective PAYMENT_CREDIT
    default: 300
    CREDIT_CARD: 240
    DEBIT_CARD: 240
    ONLINE_BANKING: 600
    PRE_AUTHORIZED_DEBIT: 900
  refund_posting: 600              # processor refund seen, waiting for REFUND_DEBIT
  reversal_posting: 600            # processor reversal seen, waiting for ledger REVERSAL
  chargeback_posting: 900          # chargeback (or its reversal) seen, waiting for CHARGEBACK_DEBIT/CREDIT
  settlement: 3600                 # processor transaction seen, waiting for its settlement-file line (business days)
  orphan_reference: 600            # refund/reversal/chargeback references an unknown transaction

# Waiting periods of bank-settled methods only elapse on bank business days: a pre-authorized debit
# initiated on Friday evening before a long weekend is not "missing" on Monday.
# The holiday list is an ILLUSTRATIVE set of Canadian bank holidays (observed dates). Production must load
# the official Payments Canada non-processing days.
business_calendar:
  timezone: "America/Toronto"
  non_business_weekdays: [5, 6]    # Saturday, Sunday (Monday = 0)
  business_day_methods: [PRE_AUTHORIZED_DEBIT, ONLINE_BANKING]
  holidays:
    - 2026-01-01  # New Year's Day
    - 2026-04-03  # Good Friday
    - 2026-05-18  # Victoria Day
    - 2026-07-01  # Canada Day
    - 2026-09-07  # Labour Day
    - 2026-10-12  # Thanksgiving
    - 2026-11-11  # Remembrance Day
    - 2026-12-25  # Christmas Day
    - 2026-12-28  # Boxing Day (observed)
    - 2027-01-01  # New Year's Day
    - 2027-03-26  # Good Friday
    - 2027-05-24  # Victoria Day
    - 2027-07-01  # Canada Day
    - 2027-09-06  # Labour Day
    - 2027-10-11  # Thanksgiving
    - 2027-11-11  # Remembrance Day
    - 2027-12-27  # Christmas Day (observed)
    - 2027-12-28  # Boxing Day (observed)

timestamp_rules:
  max_future_skew_seconds: 300
  max_age_days: 400

late_event_threshold_seconds: 60   # ingestion_time - event_time above this counts as a late arrival

data_quality_thresholds:
  max_quarantine_rate: 0.02              # quarantined raw events / raw events
  max_duplicate_delivery_rate: 0.05      # duplicate raw deliveries / raw events
  max_late_event_rate: 0.15              # late raw events / valid raw events
  max_open_exception_rate: 0.05          # open exception cases / cases for the business date
  min_source_completeness: 0.95          # payments with a record from the source / payments with an app record
