<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="965" viewBox="0 0 1500 965" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474F"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A949C"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C62828"/>
    </marker>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #1F2A33; }
      .subtitle { font-size: 12.5px; fill: #5A6670; }
      .group-title { font-size: 13px; font-weight: 700; letter-spacing: 1px; }
      .group-sub { font-size: 11px; fill: #5A6670; }
      .box-title { font-size: 13.5px; font-weight: 700; fill: #1F2A33; }
      .box-line { font-size: 11.5px; fill: #3E4A54; }
      .topic { font-size: 11px; font-family: Consolas, Menlo, monospace; fill: #1F2A33; }
      .edge-label { font-size: 10.5px; fill: #5A6670; font-style: italic; }
      .flow { stroke: #37474F; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .meta { stroke: #8A949C; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; marker-end: url(#arrow-grey); }
      .dlq { stroke: #C62828; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; marker-end: url(#arrow-red); }
    </style>
  </defs>

  <rect width="1500" height="965" fill="#FFFFFF"/>
  <text class="title" x="750" y="36" text-anchor="middle">Payment Reconciliation Platform - Architecture</text>
  <text class="subtitle" x="750" y="57" text-anchor="middle">Streaming reconciliation of app, processor, billing ledger and settlement data · Kafka + PostgreSQL · Bell-inspired, synthetic data, not affiliated with Bell</text>

  <!-- Sources -->
  <rect x="20" y="90" width="240" height="520" rx="12" fill="#EAF2FC" stroke="#4A78B5" stroke-width="1.5"/>
  <text class="group-title" x="140" y="114" text-anchor="middle" fill="#2F5A93">SOURCE SYSTEMS</text>
  <g>
    <rect x="40" y="135" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#4A78B5"/>
    <text class="box-title" x="140" y="163" text-anchor="middle">MyBell app</text>
    <text class="box-line" x="140" y="183" text-anchor="middle">payment initiated · status</text>
    <rect x="40" y="225" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#4A78B5"/>
    <text class="box-title" x="140" y="253" text-anchor="middle">Payment processor</text>
    <text class="box-line" x="140" y="273" text-anchor="middle">capture · refund · chargeback</text>
    <rect x="40" y="315" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#4A78B5"/>
    <text class="box-title" x="140" y="343" text-anchor="middle">Billing ledger</text>
    <text class="box-line" x="140" y="363" text-anchor="middle">credits · reversals · fees</text>
    <rect x="40" y="405" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#4A78B5"/>
    <text class="box-title" x="140" y="433" text-anchor="middle">Processor settlement</text>
    <text class="box-line" x="140" y="453" text-anchor="middle">daily files via SFTP</text>
    <text class="group-sub" x="140" y="530" text-anchor="middle">Synthetic simulators today;</text>
    <text class="group-sub" x="140" y="546" text-anchor="middle">real systems publish to the</text>
    <text class="group-sub" x="140" y="562" text-anchor="middle">same topics and contracts</text>
  </g>

  <!-- Edge: settlement adapter and schema registry -->
  <rect x="290" y="405" width="160" height="70" rx="8" fill="#FFFFFF" stroke="#3C9A5F" stroke-width="1.5"/>
  <text class="box-title" x="370" y="430" text-anchor="middle">Settlement adapter</text>
  <text class="box-line" x="370" y="449" text-anchor="middle">header / trailer checks</text>
  <text class="box-line" x="370" y="465" text-anchor="middle">one event per line</text>

  <rect x="290" y="540" width="160" height="65" rx="8" fill="#FFFFFF" stroke="#8A949C" stroke-width="1.5"/>
  <text class="box-title" x="370" y="566" text-anchor="middle">Schema registry</text>
  <text class="box-line" x="370" y="585" text-anchor="middle">Avro · BACKWARD gate</text>

  <!-- Kafka -->
  <rect x="480" y="90" width="240" height="520" rx="12" fill="#FFF5E6" stroke="#E08A1E" stroke-width="1.5"/>
  <text class="group-title" x="600" y="114" text-anchor="middle" fill="#B5650B">APACHE KAFKA</text>
  <text class="group-sub" x="600" y="129" text-anchor="middle">SASL_SSL · RF 3 · JSON or Avro</text>
  <rect x="495" y="140" width="210" height="36" rx="18" fill="#FFFFFF" stroke="#E08A1E"/>
  <text class="topic" x="600" y="162" text-anchor="middle">mybell.payment.events</text>
  <rect x="495" y="186" width="210" height="36" rx="18" fill="#FFFFFF" stroke="#E08A1E"/>
  <text class="topic" x="600" y="208" text-anchor="middle">processor.transaction.events</text>
  <rect x="495" y="232" width="210" height="36" rx="18" fill="#FFFFFF" stroke="#E08A1E"/>
  <text class="topic" x="600" y="254" text-anchor="middle">billing.ledger.events</text>
  <rect x="495" y="278" width="210" height="36" rx="18" fill="#FFFFFF" stroke="#E08A1E"/>
  <text class="topic" x="600" y="300" text-anchor="middle">processor.settlement.events</text>
  <line x1="500" y1="333" x2="700" y2="333" stroke="#E8B97A" stroke-dasharray="3 3"/>
  <rect x="495" y="350" width="210" height="36" rx="18" fill="#FDECEA" stroke="#C62828"/>
  <text class="topic" x="600" y="372" text-anchor="middle">payment.reconciliation.dlq</text>
  <rect x="495" y="396" width="210" height="36" rx="18" fill="#FFFFFF" stroke="#E08A1E" stroke-width="1.8"/>
  <text class="topic" x="600" y="418" text-anchor="middle">payment.reconciliation.events</text>

  <rect x="495" y="650" width="210" height="55" rx="8" fill="#F4F5F6" stroke="#8A949C"/>
  <text class="box-title" x="600" y="673" text-anchor="middle">Downstream consumers</text>
  <text class="box-line" x="600" y="692" text-anchor="middle">case-change events</text>

  <!-- Processing services -->
  <rect x="760" y="90" width="240" height="560" rx="12" fill="#EBF7EF" stroke="#3C9A5F" stroke-width="1.5"/>
  <text class="group-title" x="880" y="114" text-anchor="middle" fill="#2B7347">PROCESSING SERVICES</text>
  <rect x="775" y="135" width="210" height="105" rx="8" fill="#FFFFFF" stroke="#3C9A5F"/>
  <text class="box-title" x="880" y="160" text-anchor="middle">Ingestion (HPA 3-6)</text>
  <text class="box-line" x="880" y="180" text-anchor="middle">decode JSON / Avro, validate</text>
  <text class="box-line" x="880" y="197" text-anchor="middle">deduplicate, quarantine bad</text>
  <text class="box-line" x="880" y="214" text-anchor="middle">bulk write · 1 txn per batch</text>
  <rect x="775" y="255" width="210" height="95" rx="8" fill="#FFFFFF" stroke="#3C9A5F"/>
  <text class="box-title" x="880" y="280" text-anchor="middle">Reconciliation (HPA 2-6)</text>
  <text class="box-line" x="880" y="300" text-anchor="middle">match app · processor · ledger</text>
  <text class="box-line" x="880" y="317" text-anchor="middle">+ settlement; waiting periods</text>
  <text class="box-line" x="880" y="334" text-anchor="middle">SKIP LOCKED work queue</text>
  <rect x="775" y="365" width="210" height="60" rx="8" fill="#FFFFFF" stroke="#3C9A5F"/>
  <text class="box-title" x="880" y="390" text-anchor="middle">Admin CLI</text>
  <text class="box-line" x="880" y="409" text-anchor="middle">audited holds and replays</text>
  <rect x="775" y="440" width="210" height="70" rx="8" fill="#FFFFFF" stroke="#3C9A5F"/>
  <text class="box-title" x="880" y="465" text-anchor="middle">Batch scheduler</text>
  <text class="box-line" x="880" y="485" text-anchor="middle">business-date runs</text>
  <text class="box-line" x="880" y="500" text-anchor="middle">control totals · DQ checks</text>
  <rect x="775" y="525" width="210" height="70" rx="8" fill="#FFFFFF" stroke="#3C9A5F"/>
  <text class="box-title" x="880" y="550" text-anchor="middle">Retention job</text>
  <text class="box-line" x="880" y="570" text-anchor="middle">archive old Bronze payloads</text>
  <text class="box-line" x="880" y="585" text-anchor="middle">drop expired partitions</text>

  <!-- PostgreSQL -->
  <rect x="1040" y="90" width="250" height="560" rx="12" fill="#F1EDFB" stroke="#6B4FBB" stroke-width="1.5"/>
  <text class="group-title" x="1165" y="114" text-anchor="middle" fill="#4E3699">POSTGRESQL 17</text>
  <text class="group-sub" x="1165" y="129" text-anchor="middle">verify-full TLS · least-privilege roles</text>
  <rect x="1055" y="140" width="220" height="65" rx="8" fill="#FFFFFF" stroke="#6B4FBB"/>
  <text class="box-title" x="1165" y="162" text-anchor="middle">Bronze</text>
  <text class="box-line" x="1165" y="181" text-anchor="middle">raw events, exact bytes</text>
  <text class="box-line" x="1165" y="196" text-anchor="middle">quarantine · dedup keys</text>
  <rect x="1055" y="220" width="220" height="85" rx="8" fill="#FFFFFF" stroke="#6B4FBB"/>
  <text class="box-title" x="1165" y="243" text-anchor="middle">Silver</text>
  <text class="box-line" x="1165" y="262" text-anchor="middle">requests · processor txns</text>
  <text class="box-line" x="1165" y="278" text-anchor="middle">refunds · chargebacks</text>
  <text class="box-line" x="1165" y="294" text-anchor="middle">ledger · settlement records</text>
  <rect x="1055" y="320" width="220" height="40" rx="8" fill="#FFFFFF" stroke="#6B4FBB"/>
  <text class="box-title" x="1165" y="345" text-anchor="middle">Work queue</text>
  <rect x="1055" y="375" width="220" height="80" rx="8" fill="#FFFFFF" stroke="#6B4FBB"/>
  <text class="box-title" x="1165" y="399" text-anchor="middle">Reconciliation cases</text>
  <text class="box-line" x="1165" y="419" text-anchor="middle">history (monthly partitions)</text>
  <text class="box-line" x="1165" y="436" text-anchor="middle">transactional outbox</text>
  <rect x="1055" y="470" width="220" height="55" rx="8" fill="#FFFFFF" stroke="#6B4FBB"/>
  <text class="box-title" x="1165" y="492" text-anchor="middle">Batch results</text>
  <text class="box-line" x="1165" y="511" text-anchor="middle">run history · control totals · DQ</text>
  <rect x="1055" y="540" width="220" height="55" rx="8" fill="#FFFFFF" stroke="#6B4FBB"/>
  <text class="box-title" x="1165" y="562" text-anchor="middle">Gold views</text>
  <text class="box-line" x="1165" y="581" text-anchor="middle">daily summary · exceptions</text>

  <!-- Consumers and operations -->
  <text class="group-title" x="1400" y="114" text-anchor="middle" fill="#4A545C">CONSUMERS &amp; OPS</text>
  <rect x="1320" y="135" width="160" height="90" rx="8" fill="#F4F5F6" stroke="#8A949C"/>
  <text class="box-title" x="1400" y="158" text-anchor="middle">Observability</text>
  <text class="box-line" x="1400" y="177" text-anchor="middle">Prometheus, Alertmanager</text>
  <text class="box-line" x="1400" y="194" text-anchor="middle">Grafana dashboards</text>
  <text class="box-line" x="1400" y="211" text-anchor="middle">12 alert rules</text>
  <rect x="1320" y="380" width="160" height="70" rx="8" fill="#F4F5F6" stroke="#8A949C"/>
  <text class="box-title" x="1400" y="403" text-anchor="middle">Exception review</text>
  <text class="box-line" x="1400" y="422" text-anchor="middle">cases by reason code</text>
  <text class="box-line" x="1400" y="438" text-anchor="middle">finance / operations</text>
  <rect x="1320" y="540" width="160" height="55" rx="8" fill="#F4F5F6" stroke="#8A949C"/>
  <text class="box-title" x="1400" y="562" text-anchor="middle">Reports &amp; BI</text>
  <text class="box-line" x="1400" y="581" text-anchor="middle">gold views · SQL reports</text>
  <rect x="1320" y="662" width="160" height="56" rx="8" fill="#F4F5F6" stroke="#8A949C"/>
  <text class="box-title" x="1400" y="685" text-anchor="middle">Bronze archive</text>
  <text class="box-line" x="1400" y="704" text-anchor="middle">gzip NDJSON · WORM</text>

  <!-- Flows: sources to Kafka -->
  <line class="flow" x1="240" y1="170" x2="493" y2="158"/>
  <line class="flow" x1="240" y1="260" x2="493" y2="204"/>
  <line class="flow" x1="240" y1="350" x2="493" y2="250"/>
  <line class="flow" x1="240" y1="440" x2="288" y2="440"/>
  <text class="edge-label" x="264" y="433" text-anchor="middle">files</text>
  <line class="flow" x1="450" y1="440" x2="493" y2="296"/>
  <line class="meta" x1="450" y1="572" x2="478" y2="572"/>
  <text class="edge-label" x="370" y="625" text-anchor="middle">schema ids for producers and ingestion</text>

  <!-- Kafka to services -->
  <line class="flow" x1="722" y1="250" x2="773" y2="190"/>
  <text class="edge-label" x="742" y="208" text-anchor="middle">consume</text>
  <line class="dlq" x1="775" y1="228" x2="707" y2="366"/>
  <text class="edge-label" x="752" y="330" text-anchor="middle" fill="#C62828">quarantine</text>
  <line class="flow" x1="775" y1="338" x2="707" y2="414"/>
  <text class="edge-label" x="752" y="400" text-anchor="middle">outbox</text>
  <line class="flow" x1="600" y1="432" x2="600" y2="648"/>
  <text class="edge-label" x="606" y="636">case changes</text>

  <!-- Services to PostgreSQL -->
  <line class="flow" x1="987" y1="165" x2="1053" y2="172"/>
  <line class="flow" x1="987" y1="190" x2="1053" y2="258"/>
  <line class="flow" x1="987" y1="215" x2="1053" y2="336"/>
  <line class="flow" x1="1053" y1="347" x2="987" y2="306"/>
  <line class="flow" x1="987" y1="322" x2="1053" y2="404"/>
  <line class="meta" x1="987" y1="395" x2="1053" y2="428"/>
  <line class="flow" x1="987" y1="475" x2="1053" y2="497"/>
  <polyline class="flow" points="987,560 1018,560 1018,690 1318,690"/>
  <text class="edge-label" x="1165" y="683" text-anchor="middle">archive payloads older than 90 days</text>

  <!-- PostgreSQL to consumers -->
  <line class="flow" x1="1277" y1="415" x2="1318" y2="415"/>
  <line class="flow" x1="1277" y1="567" x2="1318" y2="567"/>
  <polyline class="meta" points="880,90 880,76 1400,76 1400,133"/>
  <text class="edge-label" x="1140" y="71" text-anchor="middle">/metrics · /healthz · /readyz</text>

  <!-- Platform band -->
  <rect x="20" y="745" width="1460" height="160" rx="12" fill="#F6F8FB" stroke="#B7C2CC" stroke-width="1.5"/>
  <text class="group-title" x="750" y="770" text-anchor="middle" fill="#4A545C">PLATFORM, SECURITY &amp; DELIVERY</text>
  <g>
    <rect x="35" y="785" width="276" height="105" rx="8" fill="#FFFFFF" stroke="#B7C2CC"/>
    <text class="box-title" x="173" y="810" text-anchor="middle">Kubernetes (Helm)</text>
    <text class="box-line" x="173" y="831" text-anchor="middle">autoscaled ingestion and reconciliation</text>
    <text class="box-line" x="173" y="849" text-anchor="middle">PodDisruptionBudgets · NetworkPolicy</text>
    <text class="box-line" x="173" y="867" text-anchor="middle">non-root, read-only containers</text>

    <rect x="321" y="785" width="276" height="105" rx="8" fill="#FFFFFF" stroke="#B7C2CC"/>
    <text class="box-title" x="459" y="810" text-anchor="middle">Safe releases</text>
    <text class="box-line" x="459" y="831" text-anchor="middle">pre-upgrade hooks: migrations, topics</text>
    <text class="box-line" x="459" y="849" text-anchor="middle">and a schema compatibility gate</text>
    <text class="box-line" x="459" y="867" text-anchor="middle">checksum-verified migrations</text>

    <rect x="607" y="785" width="276" height="105" rx="8" fill="#FFFFFF" stroke="#B7C2CC"/>
    <text class="box-title" x="745" y="810" text-anchor="middle">Security</text>
    <text class="box-line" x="745" y="831" text-anchor="middle">SASL_SSL / mTLS Kafka · verify-full DB</text>
    <text class="box-line" x="745" y="849" text-anchor="middle">secrets mounted as files (*_FILE)</text>
    <text class="box-line" x="745" y="867" text-anchor="middle">least-privilege roles · append-only audit</text>

    <rect x="893" y="785" width="276" height="105" rx="8" fill="#FFFFFF" stroke="#B7C2CC"/>
    <text class="box-title" x="1031" y="810" text-anchor="middle">CI/CD (GitHub Actions)</text>
    <text class="box-line" x="1031" y="831" text-anchor="middle">lint · type checks · unit tests · Helm lint</text>
    <text class="box-line" x="1031" y="849" text-anchor="middle">integration, e2e and recovery suites</text>
    <text class="box-line" x="1031" y="867" text-anchor="middle">image published to GHCR</text>

    <rect x="1179" y="785" width="286" height="105" rx="8" fill="#FFFFFF" stroke="#B7C2CC"/>
    <text class="box-title" x="1322" y="810" text-anchor="middle">Operations</text>
    <text class="box-line" x="1322" y="831" text-anchor="middle">scheduled production runs, twice daily</text>
    <text class="box-line" x="1322" y="849" text-anchor="middle">daily retention CronJob · backups</text>
    <text class="box-line" x="1322" y="867" text-anchor="middle">runbook · alert routing</text>
  </g>

  <!-- Legend -->
  <line class="flow" x1="430" y1="938" x2="480" y2="938"/>
  <text class="box-line" x="488" y="942">data flow</text>
  <line class="meta" x1="600" y1="938" x2="650" y2="938"/>
  <text class="box-line" x="658" y="942">metadata / control</text>
  <line class="dlq" x1="810" y1="938" x2="860" y2="938"/>
  <text class="box-line" x="868" y="942">invalid events to the dead-letter topic</text>
</svg>
