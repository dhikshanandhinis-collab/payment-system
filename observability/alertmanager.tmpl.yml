# Rendered at container start by docker-compose.prod.yml (placeholders replaced from .env).
global:
  smtp_smarthost: "__SMTP_SMARTHOST__"
  smtp_from: "__SMTP_FROM__"
  smtp_auth_username: "__SMTP_USERNAME__"
  smtp_auth_password_file: /tmp/smtp_password
  smtp_require_tls: true

route:
  receiver: email
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: email
    email_configs:
      - to: "__ALERT_EMAIL_TO__"
        send_resolved: true
