global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: bell-recon
    static_configs:
      - targets: ["ingestion:9100"]
        labels: {service: ingestion}
      - targets: ["reconciliation:9100"]
        labels: {service: reconciliation}
      - targets: ["mybell-producer:9100"]
        labels: {service: mybell-producer}
      - targets: ["processor-producer:9100"]
        labels: {service: processor-producer}
      - targets: ["billing-producer:9100"]
        labels: {service: billing-producer}
      - targets: ["batch-scheduler:9100"]
        labels: {service: batch-scheduler}

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels: {service: node-exporter}

  - job_name: monitoring
    static_configs:
      - targets: ["localhost:9090"]
        labels: {service: prometheus}
      - targets: ["alertmanager:9093"]
        labels: {service: alertmanager}
